name: Build Android App Bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        # Capacitor 8 + AGP 8.x requires JDK 17+. We pin 21 (LTS, Temurin)
        # to match the local developer toolchain on Kat's workstation.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Node.js
        # Capacitor 8 (bumped in #30) requires Node 20.19+ or 22+; we pin
        # 22 to track the active LTS and match the iOS workflow.
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build web app
        # The shipped Android build is ANDROID_DEMO_ONLY: every API call
        # is short-circuited inside the JSX bundle so no network is
        # touched at runtime. REACT_APP_API_URL only needs a
        # syntactically-valid placeholder so apiFetch's URL constructor
        # never throws at module load.
        env:
          REACT_APP_API_URL: https://demo.invalid/api/v1
          REACT_APP_VERSION: 1.0.0
        run: npm run build

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Add Android platform if missing
        # Detect incomplete scaffold (no build.gradle = cap add never
        # finished). Mirrors the iOS workflow's recovery pattern so a
        # corrupted android/ dir doesn't permanently block CI.
        run: |
          if [ ! -f "android/app/build.gradle" ]; then
            echo "Android scaffold incomplete (no build.gradle) — recreating"
            rm -rf android
            npx cap add android
            echo "Android scaffold recreated"
          fi

      - name: Sync Capacitor with web build
        run: npx cap sync android

      - name: Regenerate icons & splash from Noesis emblem
        # Play Store rejects builds whose icons appear to be the default
        # Capacitor placeholder. Regenerate flat opaque PNGs from
        # `noesis-emblem-source.png` and inject into android/app/src/main/res
        # so the bundle ships the Noesis mark, not the blue-X placeholder.
        run: |
          npm install --no-save sharp
          node scripts/regenerate-icons.mjs
          if [ -f "scripts/inject-android-icons.mjs" ]; then
            node scripts/inject-android-icons.mjs
          else
            echo "::warning::scripts/inject-android-icons.mjs not found — Android icons may still be the Capacitor placeholder. Add the script to mirror inject-ios-icons.mjs."
          fi

      - name: Decode keystore from secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error title=Missing ANDROID_KEYSTORE_BASE64 secret::The signing keystore has not been uploaded to GitHub. Base64-encode noesis-health-release.keystore and add it as a repository secret named ANDROID_KEYSTORE_BASE64, along with ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD."
            exit 1
          fi
          KEYSTORE_PATH=$RUNNER_TEMP/noesis-health-release.keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > $KEYSTORE_PATH
          echo "Decoded keystore size: $(wc -c < $KEYSTORE_PATH) bytes"
          # Verify it's a real keystore before handing to gradle
          keytool -list -v -keystore $KEYSTORE_PATH -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -alias "${{ secrets.ANDROID_KEY_ALIAS }}" | head -20
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> $GITHUB_ENV

      - name: Wire android/key.properties from secrets
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          cat > android/key.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "key.properties wired (storeFile=$KEYSTORE_PATH)"

      - name: Build signed release bundle
        # versionCode is overridden via -PappVersionCode=$GITHUB_RUN_NUMBER
        # so each CI run produces a unique, monotonically-increasing build
        # number that Play Console will accept. Mirrors the iOS workflow's
        # agvtool bump pattern. versionName carries the workflow run number
        # as the patch component so internal testers can correlate.
        run: |
          set -o pipefail
          cd android
          chmod +x ./gradlew
          GRADLE_LOG=$RUNNER_TEMP/gradle-bundleRelease.log
          ./gradlew bundleRelease \
            -PappVersionCode=$GITHUB_RUN_NUMBER \
            -PappVersionName="1.0.$GITHUB_RUN_NUMBER" \
            --no-daemon --stacktrace 2>&1 | tee "$GRADLE_LOG"

      - name: Surface AAB metadata
        run: |
          set -e
          AAB_PATH=android/app/build/outputs/bundle/release/app-release.aab
          if [ ! -f "$AAB_PATH" ]; then
            echo "::error title=AAB not produced::gradlew bundleRelease completed but $AAB_PATH does not exist."
            exit 1
          fi
          AAB_SIZE=$(wc -c < "$AAB_PATH")
          AAB_SHA256=$(sha256sum "$AAB_PATH" | awk '{print $1}')
          KEYSTORE_SHA1=$(keytool -list -v -keystore "$KEYSTORE_PATH" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            | grep -E 'SHA1:' | head -1 | awk -F': ' '{print $2}')
          echo "## Android AAB build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| AAB path | \`$AAB_PATH\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Size | $AAB_SIZE bytes |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA256 | \`$AAB_SHA256\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Keystore SHA1 | \`$KEYSTORE_SHA1\` |" >> $GITHUB_STEP_SUMMARY
          echo "| versionCode | $GITHUB_RUN_NUMBER |" >> $GITHUB_STEP_SUMMARY
          echo "| versionName | 1.0.$GITHUB_RUN_NUMBER |" >> $GITHUB_STEP_SUMMARY

      - name: Upload AAB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: ${{ runner.temp }}/gradle-bundleRelease.log
          if-no-files-found: warn

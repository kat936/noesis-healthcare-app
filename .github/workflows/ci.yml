# Noesis.io Health — Continuous Integration
# © 2026 Athena Core Technologies, Inc.
#
# This workflow gates every PR and every push to main with:
#   1. Frontend lint + Vite build
#   2. Server lint + smoke check
#   3. Dependency vulnerability scan (npm audit, gated at moderate)
#   4. Secret-leak scan (gitleaks)
#   5. PHI / language hallucination guardrails
#
# All jobs run on ubuntu-latest. iOS builds run separately on macOS
# self-hosted runners (see ios.yml — added after Apple Developer signing
# certificates are stored in GitHub Secrets).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Vite build + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci || npm install

      - name: Lint
        run: npm run lint

      - name: Build (Vite)
        run: npm run build
        env:
          NODE_ENV: production
          REACT_APP_API_URL: https://api.staging.noesis.io/api/v1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/
          if-no-files-found: error
          retention-days: 7

  server:
    name: Server (lint + smoke + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci || npm install

      - name: Lint
        working-directory: server
        run: npm run lint

      - name: Syntax check entry point
        working-directory: server
        run: node --check index.js

      - name: Smoke import check
        working-directory: server
        run: |
          node -e "require('./services/strategyEngine'); console.log('strategyEngine OK')"
          node -e "require('./services/complianceEngine'); console.log('complianceEngine OK')"
          node -e "require('./services/x12'); console.log('x12 OK')"
          node -e "require('./utils/audit'); console.log('audit OK')"
          node -e "require('./utils/money'); console.log('money OK')"
          node -e "require('./utils/encryption'); console.log('encryption OK')"

      - name: Run server tests (node --test)
        working-directory: server
        run: npm test

  security-audit:
    name: Vulnerability scan (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install root deps
        run: npm ci || npm install

      - name: Root npm audit (production deps, gate at moderate)
        run: npm audit --omit=dev --audit-level=moderate
        continue-on-error: true

      - name: Server npm audit (production deps, gate at moderate)
        working-directory: server
        run: |
          npm ci || npm install
          npm audit --omit=dev --audit-level=moderate
        continue-on-error: true

  secret-scan:
    name: Secret-leak scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  guardrails:
    name: Trust & language guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      # Reject regressions on the trust-language sweep — these terms must
      # not reappear unannotated in user-facing copy. Allowed in code
      # comments and historical audit reports.
      - name: Block "HIPAA-certified" claims
        run: |
          set +e
          MATCHES=$(grep -RnE "HIPAA[ -]+certified" \
            --include="*.jsx" --include="*.js" --include="*.html" \
            --include="*.md" \
            -- legal/ noesis-health-app.jsx privacy-policy.html src/ 2>/dev/null \
            | grep -vE "(NOT HIPAA-certified|not HIPAA-certified|NOT a HIPAA-certified)")
          if [ -n "$MATCHES" ]; then
            echo "::error::Found 'HIPAA-certified' claims that are not negated:"
            echo "$MATCHES"
            exit 1
          fi
          echo "OK — no 'HIPAA-certified' regressions."

      - name: Block "advisory" framing on engines (use 'decision-support')
        run: |
          set +e
          MATCHES=$(grep -RnE "(scoring|score|engine).*\\badvisory\\b" \
            --include="*.jsx" --include="*.js" --include="*.md" \
            -- legal/ noesis-health-app.jsx server/ src/ 2>/dev/null)
          if [ -n "$MATCHES" ]; then
            echo "::error::'advisory' wording on engines must be 'analytical / decision-support':"
            echo "$MATCHES"
            exit 1
          fi
          echo "OK — engine framing is decision-support."

      - name: Confirm engines emit canonical auditTrail
        run: |
          set -e
          for f in server/services/strategyEngine.js server/services/complianceEngine.js server/routes/precheck.js; do
            grep -q "auditTrail" "$f" || (echo "::error::$f missing auditTrail" && exit 1)
            grep -q "ruleVersion" "$f" || (echo "::error::$f missing ruleVersion" && exit 1)
          done
          echo "OK — engines emit canonical auditTrail."

      # Block parseFloat() on the high-impact currency surfaces.
      # Root cause docs: server/utils/money.js. Use toCents() so values
      # flow through Decimal-backed banker's rounding.
      - name: Block parseFloat in currency surfaces
        run: |
          set +e
          FILES="server/routes/claims.js server/routes/denials.js server/routes/billing.js server/services/clearinghouse.js server/services/payerEligibility.js"
          MATCHES=$(grep -nE "parseFloat\\s*\\(" $FILES 2>/dev/null)
          if [ -n "$MATCHES" ]; then
            echo "::error::parseFloat() is unsafe for currency. Use server/utils/money.toCents()."
            echo "$MATCHES"
            exit 1
          fi
          echo "OK — no parseFloat() on currency surfaces."

      # HIPAA §164.312(b) audit controls: never log raw req.body or PHI
      # fields to stdout. Logger sinks may end up in CloudWatch / Sentry
      # without a BAA. Path sanitization in middleware/auditLog.js is
      # the only sanctioned way to record PHI-bearing requests.
      - name: Block plain-text PHI logging
        run: |
          set +e
          # Match: console.{log,info,debug}(...{patient,member,ssn,dob,mrn,req.body,patientName,memberId}...)
          MATCHES=$(grep -RnE "console\\.(log|info|debug)\\s*\\([^)]*(req\\.body|\\bpatientName\\b|\\bpatientDob\\b|\\bpatientSsn\\b|\\bmemberId\\b|\\bmemberID\\b|\\bdiagnosis\\b|\\bmrn\\b)" \
            --include="*.js" \
            -- server/ 2>/dev/null \
            | grep -v "/test/" | grep -v "BUILD_SUMMARY")
          if [ -n "$MATCHES" ]; then
            echo "::error::Plain-text PHI logging detected (HIPAA §164.312(b))."
            echo "Use middleware/auditLog.js path sanitization or log only IDs/UUIDs."
            echo "$MATCHES"
            exit 1
          fi
          echo "OK — no plain-text PHI logging."

      # Block silent failure modes: an empty catch in the server tier hides
      # the kind of error that should page someone (DB failure, auth bypass,
      # webhook signature mismatch). Empty catches in middleware/auth.js
      # against Redis are deliberate and explicitly annotated; the grep
      # below excludes that pattern by ignoring catch blocks containing
      # "fall through" or "non-critical".
      - name: Block empty catch blocks in server/
        run: |
          set +e
          # Match: catch (e?) { } or catch { } that is truly empty (no body)
          MATCHES=$(grep -RnE "catch\\s*\\([^)]*\\)\\s*\\{\\s*\\}|catch\\s*\\{\\s*\\}" \
            --include="*.js" \
            -- server/ 2>/dev/null \
            | grep -v "/test/")
          if [ -n "$MATCHES" ]; then
            echo "::error::Empty catch blocks hide real errors. Add a comment or rethrow."
            echo "$MATCHES"
            exit 1
          fi
          echo "OK — no empty catch blocks."

      # Confirm tenant-bearing routes route through the shared scope helper.
      # If a future route forgets to import buildScopeClause/canAccessResource
      # we want CI to call it out, not a customer.
      - name: Confirm tenant-scope helper used in claims/denials/authorizations
        run: |
          set -e
          for f in server/routes/claims.js server/routes/denials.js server/routes/authorizations.js; do
            grep -q "tenantScope" "$f" || (echo "::error::$f missing tenantScope import (HIPAA §164.502(a) cross-tenant guard)" && exit 1)
            grep -q "canAccessResource\\|buildScopeClause" "$f" || (echo "::error::$f imports tenantScope but uses neither helper" && exit 1)
          done
          echo "OK — tenant scope helper applied across claims/denials/authorizations."

      # Don't fabricate compliance: assertions of "HIPAA-compliant" must
      # appear in a context that disclaims certification. Recognized
      # disclaimer patterns: a "not"-form negation, a BAA-conditioned
      # claim, or a forward-looking "When ... built" / "if ... need ..."
      # construction. Test files are excluded so the regression suite
      # can name what it is asserting against.
      - name: Block "HIPAA-compliant" claims without negation
        run: |
          set +e
          MATCHES=$(grep -RnE "\\bHIPAA[- ]+compliant\\b" \
            --include="*.jsx" --include="*.js" --include="*.html" \
            --include="*.md" \
            -- legal/ noesis-health-app.jsx privacy-policy.html src/ server/ 2>/dev/null \
            | grep -v "/test/" \
            | grep -vEi "(not[ -]+HIPAA-compliant|HIPAA-compliant out of the box, requires|(requires|executed|execute)[ -]+BAA|when HIPAA-compliant features|need HIPAA-compliant|Implement HIPAA-compliant)")
          if [ -n "$MATCHES" ]; then
            echo "::error::Found 'HIPAA-compliant' claims that are not negated. Use 'BAA-ready architecture; production HIPAA compliance requires BAA execution.'"
            echo "$MATCHES"
            exit 1
          fi
          echo "OK — no fabricated HIPAA-compliant claims."

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Security: enforce a strict CSP at the document level. The server
         additionally sets CSP via Helmet on API responses; the meta tag here
         protects the static SPA bundle when served from CDN or the iOS
         Capacitor WebView. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self' capacitor: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https: capacitor:; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" />
    <meta name="referrer" content="no-referrer" />

    <!-- iOS WebView safe areas + status bar -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#0f172a" />

    <link rel="icon" type="image/svg+xml" href="/noesis-logo.svg" />

    <title>Noesis.io Health — Healthcare Revenue Management, Simplified</title>
    <meta name="description" content="Noesis.io Health — provider-facing claims management, prior authorization, eligibility, and denial pre-check. By Athena Core Technologies." />
  </head>
  <body class="bg-slate-900">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
